<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Applications of “agency”: lessons from The Agency Fund</title>
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/anim.css">
<link rel="stylesheet" href="shared/taf.css">
<style>
  body.dark .slide { justify-content: center; position: relative; padding: 130px 150px;
    background: radial-gradient(120% 120% at 30% 20%, #0B2341, #061A2E 75%); }
  .slide::before { content: ""; position: absolute; inset: 0; z-index: 0;
    background: url("assets/title-page.jpg") center / cover no-repeat; opacity: 0.5; }
  .slide::after { content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(96deg, rgba(6, 26, 46, 0.95) 22%, rgba(6, 26, 46, 0.66) 62%, rgba(8, 30, 52, 0.42) 100%); }
  .slide > * { position: relative; z-index: 2; }
  .cv-topbar { position: absolute; top: 110px; left: 150px; display: flex; align-items: center; gap: 22px; }
  .tf-logo { height: 48px; width: auto; display: block; }
  .cv-eyebrow { font-size: 24px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--slate-blue); margin: 0 0 48px; }
  .cv-title { margin: 0; font-size: 108px; font-weight: 800; line-height: 1.04;
    letter-spacing: -0.02em; color: var(--white); max-width: 1620px; }
  .cv-title .accent { color: var(--gold); }
  .cv-deck { margin: 36px 0 0; font-size: 40px; font-weight: 600; line-height: 1.28;
    letter-spacing: -0.01em; color: var(--white); max-width: 1620px; }
  .cv-byline { margin: 36px 0 0; font-size: 24px; font-weight: 500; line-height: 1.5;
    color: #8FA3B8; max-width: 1620px; }
  .cv-byline .line { display: block; }
  .cv-byline .line + .line { margin-top: 8px; }
  .cv-byline strong { font-weight: 700; color: var(--white); }
  .cv-byline .sep { margin: 0 14px; color: rgba(255, 255, 255, 0.32); }
</style>
</head>
<body class="dark">
  <div class="slide">
    <div class="cv-topbar" data-reveal>
      <img class="tf-logo" src="assets/agency-fund-logo-white.svg" alt="The Agency Fund">
    </div>
    <p class="cv-eyebrow" data-reveal>Applications session &middot; Agency in Institutional and Human Capital Development Conference</p>
    <h1 class="cv-title" data-reveal>Applications of <span class="accent">&ldquo;agency&rdquo;</span></h1>
    <p class="cv-deck" data-reveal>Lessons from The Agency Fund and its AI for Global Development Accelerator</p>
    <p class="cv-byline" data-reveal>
      <span class="line"><strong>Zezhen Wu, PhD</strong><span class="sep">&middot;</span>The Agency Fund<span class="sep">&middot;</span>zezhen@agency.fund</span>
      <span class="line">Princeton University<span class="sep">&middot;</span>September 26, 2026</span>
    </p>
  </div>
<script src="shared/anim.js"></script>
<script>
/* Deck-shell integration. Keep verbatim. */
(function () {
  if (window.parent === window) return;
  document.addEventListener('keydown', function (e) {
    var nav = ['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'Home', 'End', 'Escape'];
    if (nav.indexOf(e.key) !== -1 || /^[1-9]$/.test(e.key) || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      window.parent.postMessage({ deckKey: e.key }, '*');
    }
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { window.parent.postMessage({ deckFontsReady: true }, '*'); });
  } else { window.parent.postMessage({ deckFontsReady: true }, '*'); }
})();
</script>
</body>
</html>
