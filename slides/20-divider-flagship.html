<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part 5 · The flagship study</title>
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/anim.css">
<link rel="stylesheet" href="shared/taf.css">
<style>
  /* Dark full-bleed divider with a subtle navy radial for depth. */
  body.dark .slide { justify-content: center; position: relative; padding: 130px 150px;
    background: radial-gradient(120% 120% at 30% 20%, #0B2341, #061A2E 75%); }
  .df-topbar { position: absolute; top: 110px; left: 150px; display: flex; align-items: center; }
  .df-eyebrow { font-size: 22px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--gold); margin: 0 0 30px; }
  .df-assertion { margin: 0; font-size: 92px; font-weight: 800; line-height: 1.05;
    letter-spacing: -0.02em; color: var(--white); max-width: 1080px; }
  .df-assertion .accent { color: var(--gold); }
  .df-support { margin: 42px 0 0; font-size: 28px; font-weight: 400; line-height: 1.5;
    color: #C9D4E0; max-width: 1240px; }
</style>
</head>
<body class="dark">
  <div class="slide">
    <div class="df-topbar" data-reveal>
      <span class="wordmark">The Agency Fund</span>
    </div>
    <p class="df-eyebrow" data-reveal>Part 5 &middot; The flagship study</p>
    <h1 class="df-assertion" data-reveal="scale">Now we are building <span class="accent">the instrument</span>.</h1>
    <p class="df-support" data-reveal>A joint research program with the University of Pennsylvania, running across six NGO platforms in five countries.</p>
  </div>
<script src="shared/anim.js"></script>
<script>
/* Deck-shell integration. Keep verbatim. */
(function () {
  if (window.parent === window) return;
  document.addEventListener('keydown', function (e) {
    var nav = ['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'Home', 'End', 'Escape'];
    if (nav.indexOf(e.key) !== -1 || /^[1-9]$/.test(e.key) || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      window.parent.postMessage({ deckKey: e.key }, '*');
    }
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { window.parent.postMessage({ deckFontsReady: true }, '*'); });
  } else { window.parent.postMessage({ deckFontsReady: true }, '*'); }
})();
</script>
</body>
</html>
