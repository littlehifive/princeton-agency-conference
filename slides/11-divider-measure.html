<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part 3, Measuring agency</title>
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/anim.css">
<link rel="stylesheet" href="shared/taf.css">
<style>
  /* Dark full-bleed divider with a subtle navy radial for depth. */
  body.dark .slide { justify-content: center; position: relative; padding: 130px 150px;
    background: radial-gradient(120% 120% at 30% 20%, #0B2341, #061A2E 75%); }
  .dm-topbar { position: absolute; top: 110px; left: 150px; display: flex; align-items: center; gap: 22px; }
  .dm-eyebrow { font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 30px; }
  .dm-assertion { margin: 0; font-size: 92px; font-weight: 800; line-height: 1.05;
    letter-spacing: -0.02em; color: var(--white); max-width: 1500px; }
  .dm-assertion .accent { color: var(--gold); }
  .dm-support { margin: 36px 0 0; font-size: 28px; font-weight: 400; line-height: 1.5;
    color: #C9D4E0; max-width: 1340px; }
</style>
</head>
<body class="dark">
  <div class="slide">
    <div class="dm-topbar" data-reveal>
      <span class="wordmark">The Agency Fund</span>
    </div>
    <p class="dm-eyebrow" data-reveal>Part 3 &middot; Measuring agency</p>
    <h1 class="dm-assertion" data-reveal="scale">You cannot design for what you <span class="accent">cannot see</span>.</h1>
    <p class="dm-support" data-reveal>Agency measurement is interesting, necessary, and complex. The next four slides show the approach we teach and use.</p>
  </div>
<script src="shared/anim.js"></script>
<script>
/* Deck-shell integration. Keep verbatim. */
(function () {
  if (window.parent === window) return;
  document.addEventListener('keydown', function (e) {
    var nav = ['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'Home', 'End', 'Escape'];
    if (nav.indexOf(e.key) !== -1 || /^[1-9]$/.test(e.key) || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      window.parent.postMessage({ deckKey: e.key }, '*');
    }
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { window.parent.postMessage({ deckFontsReady: true }, '*'); });
  } else { window.parent.postMessage({ deckFontsReady: true }, '*'); }
})();
</script>
</body>
</html>
